<figure
  class="kms-flow"
  id="kms-rotation-demo"
  aria-label="KMS 로테이션 전후의 DEK 보호와 기존 파일 조회"
>
  <div class="kms-flow-heading">
    <span class="kms-flow-eyebrow">KMS 로테이션 후 파일 A 읽기</span>
    <span class="kms-flow-model">과정 설명용</span>
  </div>
  <div class="kms-flow-modes" role="group" aria-label="살펴볼 과정" hidden>
    <button type="button" data-mode="rotation" aria-pressed="true">
      v1으로 DEK 보호 → v2로 교체 → 파일 A 조회
    </button>
  </div>
  <p class="kms-flow-boundary">
    모두 우리 회사 서버이며, 앱·KMS·저장소의 접근 권한은 각각 관리합니다
  </p>
  <div class="kms-flow-scene">
    <section class="kms-flow-actor" data-actor="kms" aria-label="KMS의 키">
      <p class="kms-flow-actor-title">KMS</p>
      <p class="kms-flow-actor-note">
        키 ID는 동일하며, v1·v2는 키 재료의 버전
      </p>
      <div class="kms-flow-items">
        <span class="kms-flow-item" data-kind="root">KMS 키 재료 v1</span>
      </div>
    </section>
    <section
      class="kms-flow-actor"
      data-actor="app"
      aria-label="애플리케이션의 데이터"
    >
      <p class="kms-flow-actor-title">애플리케이션</p>
      <p class="kms-flow-actor-note">파일과 평문 DEK를 메모리에서 처리</p>
      <div class="kms-flow-items">
        <span class="kms-flow-empty">평문 DEK-A 정리 완료</span>
      </div>
    </section>
    <section
      class="kms-flow-actor"
      data-actor="store"
      aria-label="저장소의 데이터"
    >
      <p class="kms-flow-actor-title">DB·파일 저장소</p>
      <p class="kms-flow-actor-note">디스크에는 암호화된 값만 보관</p>
      <div class="kms-flow-items">
        <span class="kms-flow-item" data-kind="cipher"
          >파일 A 암호문 · DEK-A로 암호화</span
        ><span class="kms-flow-item" data-kind="wrapped"
          >DEK-A 암호문 · v1으로 보호</span
        >
      </div>
    </section>
  </div>
  <p class="kms-flow-channel">
    서버 간 전송은 TLS로 보호합니다. 점에 붙은 라벨은 요청·응답에 담긴 값이며, 점선은 응답입니다.
  </p>
  <div class="kms-flow-caption" aria-live="polite" aria-atomic="true">
    <p class="kms-flow-step-title">
      파일 A와 DEK-A를 암호화해 보관한 상태입니다
    </p>
    <p class="kms-flow-step-text">
      파일 A는 DEK-A로, DEK-A는 KMS의 v1 키 재료로 암호화해 보관했습니다. 앱은
      평문 DEK-A를 정리한 상태입니다.
    </p>
  </div>
  <div class="kms-flow-controls" hidden>
    {% include posts/common/step-controls.html %}
  </div>
  <noscript
    ><p>
      애니메이션에는 JavaScript가 필요합니다. 저장·복호화 순서는 이어지는
      본문에서 확인할 수 있습니다.
    </p></noscript
  >
</figure>
